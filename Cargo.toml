[workspace]
members = [
    "autore-schema",
    "autore-core",
    "autore-store",
    "autore-app",
    "autore-events",
    "autore-cli",
    "autore-tui",
    "autore-stage1",
]
default-members = [
    "autore-schema",
    "autore-core",
    "autore-store",
    "autore-app",
    "autore-events",
    "autore-cli",
    "autore-tui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
thiserror = "2.0.18"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
rusqlite = { version = "0.37", features = ["bundled"] }
refinery = { version = "0.9", features = ["rusqlite-bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
sha2 = "0.10"
time = { version = "0.3", features = ["serde", "parsing", "formatting", "macros"] }
blake3 = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
schemars = "1"
jsonschema = "0.33"
petgraph = "0.8"
crossterm = { version = "0.29.0", features = ["event-stream"] }
ratatui = "0.30.0"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
